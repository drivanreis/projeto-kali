version: '3.8'

# ========================================================
# KALI-CORE V3.0 - Topologia de Rede Zero Trust
# Isolamento de Ambientes de Auditoria
# ========================================================

services:
  # ========================================================
  # ECOSSISTEMA ADMINISTRATIVO (BLOQUEADO NO HOST LOCAL)
  # ========================================================
  backend-admin:
    build:
      context: ./backend
      dockerfile: Dockerfile.admin
    volumes:
      - ./backend/backend/data:/app/backend/data
      - ./backend/data/reports:/app/data/reports
    # AMARRAÇÃO ESTRITA NO LOCALHOST (127.0.0.1): Bloqueia qualquer acesso externo da rede física
    ports:
      - "5190:5190"
    networks:
      - rede-privada-auditoria
    restart: always

  frontend-admin:
    build:
      context: ./frontend
      dockerfile: Dockerfile.admin
    # AMARRAÇÃO ESTRITA NO LOCALHOST: Interface do painel acessível apenas na máquina do auditor
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - rede-privada-auditoria
    restart: always

  # ========================================================
  # ECOSSISTEMA PORTAL PÚBLICO (EXPOSTO PARA A REDE INTERNA)
  # ========================================================
  coletor-publico:
    build:
      context: ./backend
      dockerfile: Dockerfile.coletor
    # EXPOSIÇÃO TOTAL (0.0.0.0): Porta 8888 aberta para as estações clientes realizarem a coleta
    # Este container serve tanto a página estática /audit quanto os endpoints da API
    ports:
      - "0.0.0.0:8888:8888"
    environment:
      - BACKEND_ADMIN_INTERNAL_URL=http://backend-admin:5190
      - SERVER_PORT=8888
    volumes:
      - ./backend/static:/app/static
    networks:
      - rede-privada-auditoria
    restart: always

networks:
  rede-privada-auditoria:
    driver: bridge

